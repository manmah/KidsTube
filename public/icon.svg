<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer TV / Screen Bezel -->
  <rect x="76" y="96" width="360" height="250" rx="36" fill="url(#screenGrad)" stroke="#334155" stroke-width="4" />
  
  <!-- Screen Inner Display -->
  <rect x="92" y="112" width="328" height="218" rx="22" fill="#030712" />

  <!-- Screen Content: Subdued wave line or TV rail -->
  <path d="M120 180 Q 200 140, 256 180 T 392 180" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M120 250 Q 200 210, 256 250 T 392 250" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

  <!-- Glowing Play Button / Badge (Restricted Leanback symbol) -->
  <circle cx="256" cy="221" r="54" fill="url(#playGrad)" filter="url(#glow)" />
  <polygon points="244,196 280,221 244,246" fill="#ffffff" />

  <!-- TV Stand Base -->
  <path d="M226 346 L220 380 L180 400 L332 400 L292 380 L286 346 Z" fill="#334155" />
  <rect x="170" y="398" width="172" height="8" rx="4" fill="#475569" />

  <!-- Remote sensor / status LED -->
  <circle cx="256" cy="336" r="3" fill="#38bdf8" />
</svg>
